project_name: Philly CHP Intelligence
paths:
  raw_data_dir: data/raw
  processed_data_dir: data/processed

datasets:
  benchmarking:
    url: https://phl.carto.com/api/v2/sql?q=SELECT+*+FROM+building_energy_benchmarking
    format: csv
  opa_properties:
    url: https://phl.carto.com/api/v2/sql?q=SELECT+*+FROM+opa_properties_public&filename=opa_properties_public&format=csv&skipfields=cartodb_id
    format: csv
  land_use:
    url: https://phl.carto.com/api/v2/sql?q=SELECT+*+FROM+land_use&filename=land_use&format=csv&skipfields=cartodb_id
    format: csv
  li_permits:
    url: https://phl.carto.com/api/v2/sql?q=SELECT+*+FROM+li_permits&filename=li_permits&format=csv&skipfields=cartodb_id
    format: csv
  li_unsafe_violations:
    url: https://phl.carto.com/api/v2/sql?q=SELECT+*+FROM+li_violations&filename=li_violations&format=csv&skipfields=cartodb_id
    format: csv
  complaints:
    url: https://phl.carto.com/api/v2/sql?q=SELECT+*+FROM+311_complaints
    format: csv
  parcels:
    url: https://phl.carto.com/api/v2/sql?q=SELECT+*+FROM+pwd_parcels&filename=pwd_parcels&format=csv&skipfields=cartodb_id
    format: csv

scoring:
  weights:
    chp_fit_score: 0.35
    deferred_maintenance_score: 0.25
    project_size_score: 0.20
    pursuit_score: 0.20
  thresholds:
    high_site_eui: 80
    large_building_sqft: 50000
    very_large_building_sqft: 150000
    recent_years_window: 5
  building_type_keywords:
    industrial:
      - INDUSTRIAL
      - MANUFACTURING
      - WAREHOUSE
      - LOGISTICS
    commercial:
      - OFFICE
      - HOSPITAL
      - HOTEL
      - UNIVERSITY
      - RETAIL
