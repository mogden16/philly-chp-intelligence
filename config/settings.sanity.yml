project_name: Philly CHP Intelligence (Sanity)
paths:
  raw_data_dir: data/raw
  processed_data_dir: data/processed

datasets:
  benchmarking_reported_2023:
    url: https://services.arcgis.com/fLeGjb7u4uXqeF9q/ArcGIS/rest/services/properties_reported_2023/FeatureServer/0/query?where=1%3D1&outFields=*&returnGeometry=true&f=json
    format: json
  benchmarking_not_reported_2023:
    url: https://services.arcgis.com/fLeGjb7u4uXqeF9q/ArcGIS/rest/services/properties_not_reported_2023/FeatureServer/0/query?where=1%3D1&outFields=*&returnGeometry=true&f=json
    format: json
  opa_properties:
    url: https://phl.carto.com/api/v2/sql?q=SELECT+*+FROM+opa_properties_public+LIMIT+5000&filename=opa_properties_public&format=csv&skipfields=cartodb_id
    format: csv
  land_use:
    url: https://phl.carto.com/api/v2/sql?q=SELECT+*+FROM+land_use+LIMIT+5000&filename=land_use&format=csv&skipfields=cartodb_id
    format: csv
  li_permits:
    url: https://phl.carto.com/api/v2/sql?q=SELECT+*+FROM+li_permits+ORDER+BY+permitissuedate+DESC+LIMIT+5000&filename=li_permits&format=csv&skipfields=cartodb_id
    format: csv
  li_unsafe_violations:
    url: https://phl.carto.com/api/v2/sql?q=SELECT+*+FROM+li_violations+ORDER+BY+violationdate+DESC+LIMIT+5000&filename=li_violations&format=csv&skipfields=cartodb_id
    format: csv
  complaints:
    url: https://phl.carto.com/api/v2/sql?q=SELECT+*,+ST_Y(the_geom)+AS+lat,+ST_X(the_geom)+AS+lng+FROM+complaints+ORDER+BY+complaintdate+DESC+LIMIT+5000&filename=complaints&format=csv&skipfields=cartodb_id
    format: csv
  parcels:
    url: https://phl.carto.com/api/v2/sql?q=SELECT+*+FROM+pwd_parcels+LIMIT+5000&filename=pwd_parcels&format=csv&skipfields=cartodb_id
    format: csv

scoring:
  weights:
    chp_fit_score: 0.35
    deferred_maintenance_score: 0.25
    project_size_score: 0.20
    pursuit_score: 0.20
  thresholds:
    high_site_eui: 80
    large_building_sqft: 50000
    very_large_building_sqft: 150000
    recent_years_window: 5
  building_type_keywords:
    industrial:
      - INDUSTRIAL
      - MANUFACTURING
      - WAREHOUSE
      - LOGISTICS
    commercial:
      - OFFICE
      - HOSPITAL
      - HOTEL
      - UNIVERSITY
      - RETAIL
